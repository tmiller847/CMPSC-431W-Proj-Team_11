<!DOCTYPE html>
<html>
<head>
    <title>NittanyAuction Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9edf2;
            /* background-color: #1f1f1f; */
        }

        .login-box {
            width: 320px;
            margin: 120px auto;
            background: #fff;
            /* background: #181818; */
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        input {
            width: 95%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background: #1f5692;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .note {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>NittanyAuction</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Email</label>
        <input type="text" name="email">

        <label>Password</label>
        <input type="password" name="password">

        <button type="submit">Log In</button>
    </form>

</div>

</body>
</html>
