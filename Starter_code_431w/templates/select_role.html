<!DOCTYPE html>
<html>
<head>
    <title>Select Role</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9edf2;
        }

        .content {
            width: 500px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
        }

        h1 {
            margin-top: 0;
        }

        .user {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }

        .roles {
            margin-top: 20px;
        }

        button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            background: #2a6ebb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1f5692;
        }
    </style>
</head>
<body>

<div class="content">
    <h1>Select Your Role</h1>

    <div class="user">
        Logged in as: <strong>{{ email }}</strong>
    </div>

    <div class="roles">
        <form method="POST" action="/choose_role">
            <input type="hidden" name="email" value="{{ email }}">
            {% for role in roles %}
                <button type="submit" name="role" value="{{ role }}">{{ role }}</button>
            {% endfor %}
        </form>
    </div>
</div>

</body>
</html>
