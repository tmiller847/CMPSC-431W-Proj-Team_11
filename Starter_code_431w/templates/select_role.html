<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Select Role</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            overflow-y: auto;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-image: 
                linear-gradient(rgba(4, 30, 66, 0.75), rgba(3, 26, 60, 0.91)),
                url("https://psu-gatsby-files-prod.s3.amazonaws.com/s3fs-public/styles/4_3_1500w/public/NL%20statue%20spring124.jpg?h=046da51e&itok=0t_5yVWj");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .banner {
            background: 
                linear-gradient(rgba(4, 33, 73, 0.75), rgba(3, 26, 60, 0.91))
                #001E44;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #001735;
        }

        .banner-left .brand {
            color: white;
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
        }

        .banner-right a {
            color: white;
            text-decoration: none;
            margin-left: 35px;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
        }

        .banner-right a:hover,
        .banner-left .brand:hover {
            text-decoration: underline;
        }
        
        .content {
            width: 500px;
            margin: 120px auto;
            background: #eff3fa;
            padding: 30px;
            border: 1px solid #031631;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        .user {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }

        .roles {
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            margin-top: 12px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background: #1f5692;
        }
    </style>
</head>
<body>
{% include "banner.html" %}

<div class="content">
    <h1>Select Your Role</h1>

    <div class="user">
        Logged in as: <strong>{{ email }}</strong>
    </div>

    <div class="roles">
        <form method="POST" action="/choose_role">
            <input type="hidden" name="email" value="{{ email }}">
            {% for role in roles %}
                <button type="submit" name="role" value="{{ role }}">{{ role }}</button>
            {% endfor %}
        </form>
    </div>
</div>

</body>
</html>
