<!DOCTYPE html>
<html>
<head>
    <title>NittanyAuction Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9edf2;
        }

        .profile-box {
            width: 360px;
            margin: 50px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        input {
            width: 95%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        input[readonly] {
            background-color: #f3f3f3;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1f5692;
        }

        .message {
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
            color: green;
        }

        .error {
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
            color: red;
        }

        .note {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }

        .note a {
            color: #2a6ebb;
            text-decoration: none;
        }

        .note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="profile-box">
    <h2>My Profile</h2>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('profile') }}">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}" readonly>

        <label>Full Name</label>
        <input type="text" name="name" value="{{ user.name }}">

        <label>Phone Number</label>
        <input type="text" name="phone" value="{{ user.phone }}">

        <label>Street</label>
        <input type="text" name="street" value="{{ user.street }}">

        <label>City</label>
        <input type="text" name="city" value="{{ user.city }}">

        <label>State</label>
        <input type="text" name="state" value="{{ user.state }}">

        <label>Zipcode</label>
        <input type="text" name="zipcode" value="{{ user.zipcode }}">

        <label>New Password</label>
        <input type="password" name="password" placeholder="Create a new password here">

        <button type="submit">Save Changes</button>
    </form>

</div>

</body>
</html>
