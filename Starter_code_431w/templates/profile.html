<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>NittanyAuction Profile</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            overflow-y: auto;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-image: 
                linear-gradient(rgba(4, 30, 66, 0.75), rgba(3, 26, 60, 0.91)),
                url("https://psu-gatsby-files-prod.s3.amazonaws.com/s3fs-public/styles/4_3_1500w/public/NL%20statue%20spring124.jpg?h=046da51e&itok=0t_5yVWj");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .banner {
            background: 
                linear-gradient(rgba(4, 33, 73, 0.75), rgba(3, 26, 60, 0.91))
                #001E44;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #001735;
        }

        .banner-left .brand {
            color: white;
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
        }

        .banner-right a {
            color: white;
            text-decoration: none;
            margin-left: 35px;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
        }

        .banner-right a:hover,
        .banner-left .brand:hover {
            text-decoration: underline;
        }

        .profile-box {
            width: 360px;
            margin: 120px auto;
            background: #eff3fa;
            padding: 30px;
            border: 1px solid #031631;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        input {
            width: 95%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        input[readonly] {
            background-color: #f3f3f3;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1f5692;
        }

        .danger-btn {
            background: #b03a3a;
        }

        .danger-btn:hover {
            background: #8f2f2f;
        }

        .role-button {
            display: inline-block;
            padding: 8px 16px;
            background: #1b497e;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            margin-top: 0px;
            margin-bottom: 10px;
        }

        .role-button:hover {
            background: #133457;
        }

        .message {
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
            color: green;
        }

        .error {
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
            color: red;
        }

        .note {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }

        .note a {
            color: #2a6ebb;
            text-decoration: none;
        }

        .note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
{% include "banner.html" %}

<div class="profile-box">
    <h2>My Profile</h2>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('profile') }}">
        <label>Email</label>
        <input type="email" name="email" value="{{ user.email }}" readonly>

        <label>Full Name</label>
        <input type="text" name="name" value="{{ user.name }}">

        {% if user.phone %}
            <label>Phone Number</label>
            <input type="text" name="phone" value="{{ user.phone }}">
        {% endif %}

        <label>Street</label>
        <input type="text" name="street" value="{{ user.street }}">

        <label>City</label>
        <input type="text" name="city" value="{{ user.city }}">

        <label>State</label>
        <input type="text" name="state" value="{{ user.state }}">

        <label>Zipcode</label>
        <input type="text" name="zipcode" value="{{ user.zipcode }}">

        <label>New Password</label>
        <input type="password" name="password" placeholder="Create a new password here">

        <div style="text-align:center; margin-top:15px;">
            <a href="{{ url_for('choose_role_page') }}" class="role-button">Change Role</a>
        </div>

        <button type="submit">Save Changes</button>
    </form>

    <form method="POST" action="{{ url_for('profile') }}"
          onsubmit="return confirm('Inactivating your account will sign you out. Continue?');">
        <input type="hidden" name="action" value="inactivate_account">
        <button class="danger-btn" type="submit">Inactivate Account</button>
    </form>

</div>

</body>
</html>
