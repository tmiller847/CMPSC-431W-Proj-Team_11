<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>NittanyAuction Login</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-image: 
                linear-gradient(rgba(4, 30, 66, 0.75), rgba(3, 26, 60, 0.91)),
                /* url("https://images.ctfassets.net/ni9rh5nu0d99/3CSU4HBvoCFNN0133wktys/8f2b9b45a895c4ed1c67d8674e70865e/shrine16-behrend.jpg?fm=webp&w=3840&q=75"); */
                url("https://psu-gatsby-files-prod.s3.amazonaws.com/s3fs-public/styles/4_3_1500w/public/NL%20statue%20spring124.jpg?h=046da51e&itok=0t_5yVWj");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .banner {
            background: 
                linear-gradient(rgba(4, 33, 73, 0.75), rgba(3, 26, 60, 0.91))
                #001E44;
            color: white;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #001735;
        }

        .banner-left .brand {
            color: white;
            text-decoration: none;
            font-size: 30px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
        }

        .banner-right a {
            color: white;
            text-decoration: none;
            margin-left: 35px;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
        }

        .banner-right a:hover,
        .banner-left .brand:hover {
            text-decoration: underline;
        }

        .login-box {
            width: 320px;
            margin: 120px auto;
            background: #eff3fa;
            padding: 30px;
            border: 1px solid #031631;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            font-size: 32px;
            text-align: center;
            font-weight: bold;
            font-family: 'Roboto', sans-serif;
            margin-bottom: 42px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            margin-bottom: 14px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            margin-top: 12px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background: #1f5692;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .note {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
{% include "banner.html" %}

<div class="login-box">
    <h2>NittanyAuction</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <label>Email</label>
        <input type="text" name="email">

        <label>Password</label>
        <input type="password" name="password">

        <button type="submit">Log In</button>
    </form>

    <div class="note">
        Don't have an account?
        <a href="{{ url_for('signup') }}">Sign up</a>
    </div>

</div>

</body>
</html>
