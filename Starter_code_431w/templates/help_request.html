<!DOCTYPE html>
<html>
<head>
    <title>NittanyAuction Help Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9edf2;
        }

        .help-box {
            width: 360px;
            margin: 60px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        select, textarea {
            width: 95%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1f5692;
        }

        .message {
            color: green;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
        }

        .back-link {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }

        .back-link a {
            color: #2a6ebb;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="help-box">
    <h2>Help Request</h2>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('help_request') }}">
        <label>Request Type</label>
        <select name="request_type" required>
            <option value="">Select a request</option>
            <option value="Change User ID">Change User ID</option>
            <option value="Add Category">Add Category</option>
            <option value="General Help">General Help</option>
        </select>

        <label>Description</label>
        <textarea name="description" rows="5" required></textarea>

        <button type="submit">Send Request</button>
    </form>

    <div class="back-link">
        <a href="{{ url_for('login') }}">Back</a>
    </div>
</div>

</body>
</html>
