<!DOCTYPE html>
<html>
<head>
    <title>NittanyAuction Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e9edf2;
        }

        .signup-box {
            width: 320px;
            margin: 60px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        input, select {
            width: 95%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: #2a6ebb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1f5692;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .login-link {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }

        .login-link a {
            color: #2a6ebb;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signup-box">
    <h2>Create Account</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('signup') }}">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Phone Number</label>
        <input type="text" name="phone">

        <label>Role</label>
        <select name="role" required>
            <option value="Bidder">Bidder</option>
            <option value="Seller">Seller</option>
            <option value="HelpDesk">HelpDesk</option>
        </select>

        <button type="submit">Sign Up</button>
    </form>

    <div class="login-link">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </div>
</div>

</body>
</html>
